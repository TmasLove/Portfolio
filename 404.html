<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirect deep links to index.html with the path encoded in the query string.
      var l = window.location
      var path = l.pathname.slice(1).split('/').map(decodeURIComponent).join('/')
      l.replace(
        l.origin + '/?/' + path + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash
      )
    </script>
  </head>
  <body></body>
</html>
