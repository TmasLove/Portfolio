name: Publish

# The site is static HTML/CSS/JS in site/ (the Mac desktop). Pushing to master publishes it
# to the gh-pages branch, which is what tommyroldan.com serves. No build step.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          enable_jekyll: false
          commit_message: "Deploy ${{ github.sha }}"
