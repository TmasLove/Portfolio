  <style>
    /* ─── Design Tokens (Neo-Brutalism) ──────────────────────── */
    :root {
      --cream:    #FFFDF5;
      --red:      #FF3B3B;
      --yellow:   #FFD93D;
      --purple:   #7B2FFF;
      --black:    #0D0D0D;
      --white:    #FFFFFF;
      --border:   3px solid #0D0D0D;
      --shadow:   6px 6px 0px #0D0D0D;
      --font-h:   'Archivo', sans-serif;
      --font-b:   'Space Grotesk', sans-serif;
    }

    /* ─── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-b);
      background: var(--cream);
      color: var(--black);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ─── Three.js Canvas (birds) ────────────────────────────── */
    canvas {
      position: fixed !important;
      top: 0; left: 0;
      width: 100% !important;
      height: 100% !important;
      z-index: 0;
      opacity: 0.35;
      pointer-events: none;
    }

    /* ─── Page Wrapper ───────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ─── Navigation ─────────────────────────────────────────── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 2rem;
      background: var(--cream);
      border-bottom: var(--border);
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .nav-brand {
      font-family: var(--font-h);
      font-weight: 900;
      font-size: 1.3rem;
      text-decoration: none;
      color: var(--black);
      letter-spacing: -0.02em;
      background: var(--yellow);
      border: var(--border);
      padding: 0.3rem 0.75rem;
      box-shadow: 3px 3px 0 var(--black);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .nav-brand:hover {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--black);
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 0.25rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .nav-links a {
      font-family: var(--font-b);
      font-weight: 700;
      font-size: 0.82rem;
      text-decoration: none;
      color: var(--black);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.35rem 0.75rem;
      border: 2px solid transparent;
      transition: all 0.15s;
    }
    .nav-links a:hover {
      border-color: var(--black);
      background: var(--red);
      color: var(--white);
    }

    /* ─── Hero Section ───────────────────────────────────────── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      text-align: center;
      gap: 1.5rem;
    }

    .hero-eyebrow {
      display: inline-block;
      font-family: var(--font-b);
      font-weight: 700;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      background: var(--red);
      color: var(--white);
      border: var(--border);
      padding: 0.3rem 1rem;
      box-shadow: 3px 3px 0 var(--black);
      opacity: 0;
      animation: slideDown 0.6s 0.1s ease forwards;
    }

    .hero-name {
      font-family: var(--font-h);
      font-weight: 900;
      font-size: clamp(3.5rem, 12vw, 9rem);
      line-height: 0.9;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--black);
      opacity: 0;
      animation: slideUp 0.7s 0.3s ease forwards;
    }

    .hero-name span {
      color: var(--red);
      display: inline-block;
      background: var(--yellow);
      padding: 0 0.1em;
      border: var(--border);
      box-shadow: var(--shadow);
      transform: rotate(-1deg);
    }

    .hero-title {
      font-family: var(--font-b);
      font-weight: 500;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: var(--black);
      opacity: 0;
      animation: slideUp 0.7s 0.5s ease forwards;
    }

    /* Typewriter cursor */
    .hero-title::after {
      content: '_';
      animation: blink 0.9s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ─── CTA Buttons ─────────────────────────────────────────── */
    .hero-ctas {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      opacity: 0;
      animation: slideUp 0.7s 0.7s ease forwards;
    }

    .btn {
      font-family: var(--font-b);
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-decoration: none;
      padding: 0.75rem 1.75rem;
      border: var(--border);
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-primary {
      background: var(--red);
      color: var(--white);
      box-shadow: var(--shadow);
    }
    .btn-primary:hover {
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0 var(--black);
    }

    .btn-outline {
      background: var(--cream);
      color: var(--black);
      box-shadow: var(--shadow);
    }
    .btn-outline:hover {
      background: var(--yellow);
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0 var(--black);
    }

    /* ─── Social Bar ─────────────────────────────────────────── */
    .social-bar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 1.5rem 2rem;
      border-top: var(--border);
      background: var(--cream);
      opacity: 0;
      animation: fadeIn 0.7s 1s ease forwards;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      font-size: 1.1rem;
      text-decoration: none;
      color: var(--black);
      border: var(--border);
      background: var(--white);
      box-shadow: 3px 3px 0 var(--black);
      transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
    }
    .social-link:hover {
      background: var(--purple);
      color: var(--white);
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--black);
    }

    /* ─── Floating Status Tag ────────────────────────────────── */
    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-family: var(--font-b);
      font-weight: 500;
      background: var(--white);
      border: var(--border);
      padding: 0.3rem 0.75rem;
      box-shadow: 3px 3px 0 var(--black);
      opacity: 0;
      animation: slideDown 0.6s 0.9s ease forwards;
    }
    .status-dot {
      width: 8px; height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse-green 2s infinite;
    }
    @keyframes pulse-green {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ─── Keyframes ──────────────────────────────────────────── */
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ─── Reduced Motion ─────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* ─── Responsive ─────────────────────────────────────────── */
    @media (max-width: 600px) {
      nav { padding: 1rem; }
      .hero { padding: 2.5rem 1rem; }
    }
  </style>
</head>
